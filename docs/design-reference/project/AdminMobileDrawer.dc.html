<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:2px solid #2457C5;outline-offset:2px}
button,input,select,textarea{font-family:inherit}
@keyframes wn-spin{to{transform:rotate(360deg)}}
.wn-spin{animation:wn-spin 0.8s linear infinite;transform-origin:center}
@keyframes wn-pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.wn-sk{background:#E4E7E3;border-radius:4px;animation:wn-pulse 1.6s cubic-bezier(0.2,0,0,1) infinite}
.wn-tip{position:relative;cursor:help}
.wn-tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;padding:6px 10px;border-radius:6px;background:#151A18;color:#FFFFFF;font-size:12px;line-height:16px;font-weight:400;text-transform:none;letter-spacing:0;white-space:normal;text-align:left;opacity:0;pointer-events:none;transition:opacity 120ms;z-index:20}
.wn-tip:hover::after,.wn-tip:focus-visible::after{opacity:1}
@media (prefers-reduced-motion: reduce){.wn-spin,.wn-sk{animation:none}.wn-tip::after{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F7F5; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #151A18">
<dc-import name="Admin" layout="mobile" section="requests" drawer-ref="REQ-5902" hint-size="390px,844px"></dc-import>
</div>

</script>
</body>
</html>
