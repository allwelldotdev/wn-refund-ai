<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worknoon — Chat sheet (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:2px solid #2457C5;outline-offset:2px}
button,input,textarea{font-family:inherit}
button:not(:disabled),a[href],select:not(:disabled),label[for],[role="button"],[role="tab"]{cursor:pointer}
button:disabled,select:disabled{cursor:not-allowed}
@keyframes wn-spin{to{transform:rotate(360deg)}}
.wn-spin{animation:wn-spin 0.8s linear infinite;transform-origin:center}
@keyframes wn-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wn-in{animation:wn-in 200ms cubic-bezier(0.2,0,0,1)}
@keyframes wn-blink{50%{opacity:0}}
.wn-caret{display:inline-block;margin-left:1px;color:#48524D;animation:wn-blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.wn-spin,.wn-in,.wn-caret{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F7F5; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #151A18">
<dc-import name="Customer" layout="mobile" start-open="{{ true }}" chat-scenario="live" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
