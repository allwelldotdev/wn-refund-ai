<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live demo — admin and customer chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:2px solid #2457C5;outline-offset:2px}
button,input,textarea{font-family:inherit}
button:not(:disabled),a[href],select:not(:disabled),label[for],[role="button"],[role="tab"]{cursor:pointer}
button:disabled,select:disabled{cursor:not-allowed}
@keyframes wn-spin{to{transform:rotate(360deg)}}
.wn-spin{animation:wn-spin 0.8s linear infinite;transform-origin:center}
@keyframes wn-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wn-in{animation:wn-in 200ms cubic-bezier(0.2,0,0,1)}
@keyframes wn-blink{50%{opacity:0}}
.wn-caret{display:inline-block;margin-left:1px;color:#48524D;animation:wn-blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.wn-spin,.wn-in,.wn-caret{animation:none}}
</style>
</helmet>
<div style="width: 2928px; height: 1040px; box-sizing: border-box; position: relative; background: #F6F7F5; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #151A18; display: flex; flex-direction: column; gap: 16px">
<div style="height: 64px; display: flex; gap: 48px; align-items: flex-end">
<div style="width: 1440px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 20px; color: #5F6963">Admin · signed in as Ngozi Adeyemi</span>
<span style="font-size: 16px; line-height: 24px; font-weight: 600">Open REQ-5905, write in “Message Amara Okafor”, then approve or deny</span>
</div>
<div style="width: 1440px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 20px; color: #5F6963">Customer · signed in as Amara Okafor</span>
<span style="font-size: 16px; line-height: 24px; font-weight: 600">Replies arrive in the open request; reply back from the same view</span>
</div>
</div>
<div style="display: flex; gap: 48px; align-items: flex-start">
<div style="position: relative; width: 1440px; height: 960px; overflow: hidden; border: 1px solid #DCE0DB; border-radius: 10px">
<dc-import name="Admin" layout="desktop" section="escalations" drawer-ref="REQ-5905" hint-size="1440px,960px"></dc-import>
</div>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; border: 1px solid #DCE0DB; border-radius: 10px">
<dc-import name="Customer" layout="desktop" start-request="REQ-5905" hint-size="1440px,900px"></dc-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2928,"height":1040}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
