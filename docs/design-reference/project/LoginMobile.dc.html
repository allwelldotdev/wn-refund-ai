<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worknoon Support — Sign in (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:2px solid #2457C5;outline-offset:2px}
button,input{font-family:inherit}
@keyframes wn-spin{to{transform:rotate(360deg)}}
.wn-spin{animation:wn-spin 0.8s linear infinite;transform-origin:center}
@media (prefers-reduced-motion: reduce){.wn-spin{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 2240px; background: #FFFFFF; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #151A18">
<dc-import name="Login" layout="mobile" scenario="default" hint-size="390px,2240px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2240}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
