services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: refund
      POSTGRES_PASSWORD: refund
      POSTGRES_DB: refund
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refund -d refund"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://refund:refund@postgres:5432/refund
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env (see .env.example)}
      # Empty means "use backend/crates/ai/models.toml".
      AI_INTAKE_MODEL: ${AI_INTAKE_MODEL:-}
      AI_INTAKE_EFFORT: ${AI_INTAKE_EFFORT:-}
      AI_RESPONDER_MODEL: ${AI_RESPONDER_MODEL:-}
      AI_RESPONDER_EFFORT: ${AI_RESPONDER_EFFORT:-}
      AI_REVIEW_MODEL: ${AI_REVIEW_MODEL:-}
      AI_REVIEW_EFFORT: ${AI_REVIEW_EFFORT:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      # Server-side only: the browser talks to the BFF, never to the API.
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata: {}
